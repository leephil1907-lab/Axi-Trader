name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Prisma validate parses the schema but does not connect to a database.
      # Railway's real DATABASE_URL remains an environment variable in production.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/axi_trader?schema=public"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint check
        run: npm run lint

      - name: Production build
        run: npm run build
