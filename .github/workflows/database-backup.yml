name: Database Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Check backup configuration
        id: config
        run: |
          if [ -n "$BACKUP_DATABASE_URL" ] && [ -n "$BACKUP_S3_BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$AWS_REGION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Backup storage secrets are not configured; skipping backup."
          fi

      - name: Install PostgreSQL client
        if: steps.config.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create compressed database backup
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p backup
          pg_dump --no-owner --no-privileges --format=custom "$BACKUP_DATABASE_URL" > "backup/axi-trader-$(date -u +%Y%m%dT%H%M%SZ).dump"

      - name: Upload backup with server-side encryption
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          aws s3 cp backup/ "s3://${BACKUP_S3_BUCKET}/axi-trader/" --recursive --sse AES256 --region "$AWS_REGION"

      - name: Remove local backup
        if: always()
        run: rm -rf backup
