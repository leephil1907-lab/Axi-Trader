name: Database Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    if: ${{ secrets.BACKUP_DATABASE_URL != '' && secrets.BACKUP_S3_BUCKET != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create compressed database backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          pg_dump --no-owner --no-privileges --format=custom "$DATABASE_URL" > "backup/axi-trader-$(date -u +%Y%m%dT%H%M%SZ).dump"

      - name: Upload backup with server-side encryption
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp backup/ "s3://${BACKUP_S3_BUCKET}/axi-trader/" --recursive --sse AES256 --region "$AWS_REGION"

      - name: Remove local backup
        if: always()
        run: rm -rf backup
